name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs docfail straight from its public repo, which is the same path
      # the Kaggle notebook takes. If that dependency breaks, CI finds out
      # before a training session does.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test
        run: |
          python -c "import docfit, docfit.settings, docfit.hardware, docfit.auth"
          python -c "import docfit.bench as b; print(sorted(b.__all__))"
          python -c "import docfit.data as d; print(sorted(d.__all__))"
          python -c "import docfit.systems, docfit.cli, docfit.train.loop"
          python -c "from docfail.metrics import critical_field_error_rate as c; print(c([]))"

      - name: Shipped configs must validate
        run: |
          python -m docfit.cli validate configs/smoke.yaml
          python -m docfit.cli validate configs/qwen2vl_lora.yaml

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Types
        run: mypy || true   # advisory until the training loop lands

      - name: Tests
        run: pytest --cov=docfit --cov-report=term-missing

  notebook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # An .ipynb keeps its cell outputs, so a token printed once stays in the
      # file and in every later commit. Fail the build rather than trust a
      # reviewer to spot it.
      - name: Reject committed notebook outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for nb in pathlib.Path("notebooks").rglob("*.ipynb"):
              doc = json.loads(nb.read_text())
              for i, cell in enumerate(doc.get("cells", [])):
                  if cell.get("outputs") or cell.get("execution_count"):
                      bad.append(f"{nb}: cell {i}")
          if bad:
              print("Notebooks must be committed with outputs cleared:")
              print("\n".join(bad))
              sys.exit(1)
          print("notebook outputs clean")
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --strict --desc || true   # advisory until deps are locked
