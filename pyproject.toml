[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docbench"
version = "0.1.0"
description = "How document field extraction fails, what accuracy costs, and what it costs to serve"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.3",
    "opencv-python-headless>=4.10",
    "python-dateutil>=2.9",
    "tenacity>=8.3",
    "diskcache>=5.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy ML stack is optional so CI stays fast and the metric and measurement
# layers stay importable on a machine with no GPU and no torch.
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "import-linter>=2.0",
]

[project.scripts]
docbench = "docbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/docbench"]
